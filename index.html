<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cloud Stratego</title>
  </head>
  <body class="bg-gray-900 text-white min-h-screen w-screen flex items-center justify-center p-3">
    <div id="app-root" class="w-full max-w-6xl">
      <section id="mode-screen" class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl text-center space-y-4">
        <h1 class="text-3xl font-bold">Stratego</h1>
        <p id="mode-status-text" class="text-gray-300">Wähle einen Spielmodus</p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
          <button id="mode-normal-btn" class="px-4 py-2 rounded-md bg-yellow-400 hover:bg-yellow-300 text-gray-900 transition font-semibold">Normal</button>
          <button id="mode-custom-btn" disabled class="px-4 py-2 rounded-md bg-gray-700 text-gray-400 cursor-not-allowed">Custom (coming soon)</button>
          <button id="mode-chaos-btn" disabled class="px-4 py-2 rounded-md bg-gray-700 text-gray-400 cursor-not-allowed">Chaos (coming soon)</button>
          <button id="mode-testing-btn" class="px-4 py-2 rounded-md bg-green-700 hover:bg-green-600 text-white transition font-semibold">Testing (ohne P2P)</button>
        </div>
      </section>

      <section id="connection-screen" class="hidden bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl text-center space-y-4">
        <h2 class="text-2xl font-bold">Lobby</h2>
        <p class="text-gray-300">Verbinde zwei Clients über Session-Key.</p>

        <div class="grid md:grid-cols-2 gap-4 text-left">
          <div class="bg-gray-900/50 border border-gray-700 rounded-lg p-3 space-y-2">
            <h3 class="font-semibold text-center">Host (Spieler 1 / Blau)</h3>
            <button id="create-session-btn" class="w-full px-3 py-2 rounded-md bg-blue-700 hover:bg-blue-600 transition font-semibold">Session erstellen</button>
            <p class="text-xs text-gray-300">Dein Session-Key:</p>
            <div id="session-key-display" class="w-full min-h-10 px-3 py-2 rounded-md bg-gray-800 border border-gray-700 text-sm break-all"></div>
          </div>

          <div class="bg-gray-900/50 border border-gray-700 rounded-lg p-3 space-y-2">
            <h3 class="font-semibold text-center">Join (Spieler 2 / Rot)</h3>
            <input id="session-key-input" type="text" placeholder="Session-Key eingeben" class="w-full px-3 py-2 rounded-md bg-gray-800 border border-gray-700 text-sm outline-none focus:border-blue-400" />
            <button id="join-session-btn" class="w-full px-3 py-2 rounded-md bg-indigo-700 hover:bg-indigo-600 transition font-semibold">Mit Session verbinden</button>
          </div>
        </div>

        <p id="connection-status-text" class="text-sm text-yellow-300">Status: Nicht verbunden</p>
        <div class="flex justify-center gap-3">
          <button id="start-online-match-btn" class="px-4 py-2 rounded-md bg-green-600 text-white font-semibold disabled:bg-gray-700 disabled:text-gray-400 disabled:cursor-not-allowed" disabled>
            Match starten
          </button>
          <button id="disconnect-session-btn" class="px-4 py-2 rounded-md bg-red-700 hover:bg-red-600 text-white font-semibold">
            Verbindung trennen
          </button>
        </div>
      </section>

      <section id="game-screen" class="hidden space-y-3">
        <div class="text-center">
          <h2 class="text-2xl font-bold">Stratego - Normal</h2>
          <p id="status-text" class="text-red-400 font-bold text-base mt-1"></p>
        </div>

        <div id="enemy-hud" class="bg-gray-800 border-2 border-gray-600 grid gap-0 shadow-2xl mx-auto"></div>

        <div class="flex flex-col justify-center items-center gap-3">
          <div id="game-board" class="bg-gray-800 border-2 border-gray-600 grid gap-0 shadow-2xl shrink-0"></div>
        </div>

        <div id="player-hud" class="bg-gray-800 border-2 border-gray-600 grid gap-0 shadow-2xl mx-auto"></div>

        <aside id="legend" class="mx-auto bg-gray-800 border border-gray-600 rounded-lg p-3 w-full max-w-sm text-xs leading-5 cursor-pointer select-none">
          <h3 class="font-bold mb-2 text-sm">Legende (tippen zum Ausblenden)</h3>
          <div id="legend-content" class="space-y-1"></div>
        </aside>
        <div class="text-center">
          <button id="show-legend-btn" class="hidden px-3 py-1 rounded-md bg-gray-700 hover:bg-gray-600 text-sm font-semibold">
            Legende anzeigen
          </button>
        </div>

        <div class="text-center">
          <button id="confirm-setup-btn" class="px-4 py-2 rounded-md bg-blue-700 text-white font-semibold disabled:bg-gray-700 disabled:text-gray-400 disabled:cursor-not-allowed" disabled>
            Aufstellung bestätigen
          </button>
        </div>
        <div class="text-center">
          <button id="abort-match-btn" class="px-4 py-2 rounded-md bg-red-700 hover:bg-red-600 text-white font-semibold">
            Spiel abbrechen / Verbindung trennen
          </button>
        </div>
        <div class="text-center">
          <button id="rematch-btn" class="hidden px-4 py-2 rounded-md bg-green-700 hover:bg-green-600 text-white font-semibold">
            Nochmal spielen
          </button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
